# BeMyStyle: URL のクエリに入る秘密のトークンを Nginx のアクセスログに残さない設定。
# 設置先と手順は docs/handover/nginx_token_log_filter.md。本番では /etc/nginx/bms_token_log_filter.conf に置き、
# nginx.conf の http ブロックにある既存の access_log 行をこのファイルの include に置き換える。
#
# 対象のクエリ名(値ごと伏せる。パスは残す):
#   token                 NAKAMA のプライベートプロジェクトの招待リンク(/business/project_invitation?token=...)
#   confirmation_token    Devise の確認メールのリンク
#   reset_password_token  Devise のパスワード再設定のリンク
#   unlock_token          Devise のアカウントロック解除のリンク
# 1つでも含む URL は、クエリ全体を "?[FILTERED]" に置き換える(ほかのクエリに秘密が混ざっていても残さないため)。

map $request_uri $bms_log_request_uri {
    default $request_uri;
    "~^(?<bms_log_path>[^?]*)\?(?:[^#]*&)?(?:token|confirmation_token|reset_password_token|unlock_token)=" "${bms_log_path}?[FILTERED]";
}

# 同じ画面から読み込まれた CSS・画像などの要求の Referer にも、元の URL(トークン付き)が入ることがある。
map $http_referer $bms_log_referer {
    default $http_referer;
    "~^(?<bms_log_ref_base>[^?]*)\?(?:[^#]*&)?(?:token|confirmation_token|reset_password_token|unlock_token)=" "${bms_log_ref_base}?[FILTERED]";
}

# 既定の main 形式と同じ並び。$request の代わりに、伏せた URL で組み立て直す。
log_format bms_filtered '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $bms_log_request_uri $server_protocol" '
                        '$status $body_bytes_sent "$bms_log_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

access_log /var/log/nginx/access.log bms_filtered;
