name: Ensure Current Singing Ranking Season

on:
  schedule:
    # 毎月1日 00:00 UTC = 09:00 JST。EC2 停止枠 (17:00–21:00 UTC) より十分前で、
    # スケジュールが数時間遅延しても停止枠に入らないため時刻は据え置き。
    - cron: '0 0 1 * *'
  workflow_dispatch:  # 手動実行も可能

jobs:
  ensure-season:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for EC2 SSH port
        env:
          EC2_HOST: ${{ secrets.HOST_NAME }}
        run: |
          set -euo pipefail

          test -n "$EC2_HOST"

          for attempt in $(seq 1 10); do
            if nc -z -w 5 "$EC2_HOST" 22; then
              echo "EC2 SSH port is reachable."
              exit 0
            fi

            if [ "$attempt" -lt 10 ]; then
              echo "EC2 SSH port is not reachable. Retry ${attempt}/10 after 30s."
              sleep 30
            fi
          done

          echo "::error::EC2 SSH port did not become reachable within the retry period."
          exit 1

      - name: SSH into EC2 and run EnsureCurrentRankingSeasonJob
        env:
          EC2_SSH_KEY: ${{ secrets.PRIVATE_KEY }}
          EC2_USER: ${{ secrets.USER_NAME }}
          EC2_HOST: ${{ secrets.HOST_NAME }}
          DEPLOY_PATH: '/home/ec2-user/be-my-style'
        run: |
          set -euo pipefail

          test -n "$EC2_SSH_KEY"
          test -n "$EC2_USER"
          test -n "$EC2_HOST"
          test -n "$DEPLOY_PATH"

          echo "$EC2_SSH_KEY" > private_key
          chmod 600 private_key

          ssh \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -i private_key \
            "${EC2_USER}@${EC2_HOST}" "DEPLOY_PATH='${DEPLOY_PATH}' bash -s" << 'EOF'
            set -euo pipefail

            echo "Host: $(hostname)"
            echo "Deploy path: ${DEPLOY_PATH}"
            echo "Running EnsureCurrentRankingSeasonJob at $(date '+%Y-%m-%d %H:%M:%S %Z')"

            cd "${DEPLOY_PATH}"
            RAILS_ENV=production ~/.rbenv/shims/bundle exec rails runner \
              "Singing::EnsureCurrentRankingSeasonJob.perform_now(Date.current)"

            echo "EnsureCurrentRankingSeasonJob completed successfully."
          EOF

          rm -f private_key
