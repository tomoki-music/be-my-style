name: Rails CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_assets_clobber:
        description: '本番assetsをclobberしてからprecompileする（古いassets残留でデザイン崩れが起きた場合のみ使用）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      force_full_deploy:
        description: '差分に関係なく bundle/yarn/precompile/singing-analyzer 再起動まですべて実行する（デプロイ記録が信用できない場合のみ使用）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# 本番デプロイを同時に2つ走らせない(後から来た実行は待つ。実行中のものは取り消さない)。
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    # 手動実行でも main の定義だけを使う(別ブランチのワークフロー定義で本番へデプロイしない)。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Deploy
      env:
        EC2_SSH_KEY: ${{ secrets.PRIVATE_KEY }}
        EC2_SSH_HOST_KEY: ${{ secrets.PRODUCTION_SSH_HOST_KEY }}
        EC2_USER: ${{ secrets.USER_NAME }}
        EC2_HOST: ${{ secrets.HOST_NAME }}
        DEPLOY_PATH: '/home/ec2-user/be-my-style'
        FORCE_ASSETS_CLOBBER: ${{ github.event.inputs.force_assets_clobber || 'false' }}
        FORCE_FULL_DEPLOY: ${{ github.event.inputs.force_full_deploy || 'false' }}
        TRIGGER_COMMIT: ${{ github.sha }}
      run: |
        set -euo pipefail

        test -n "$EC2_SSH_KEY"
        test -n "$EC2_SSH_HOST_KEY"
        test -n "$EC2_USER"
        test -n "$EC2_HOST"
        test -n "$DEPLOY_PATH"

        mkdir -p "$HOME/.ssh"
        chmod 700 "$HOME/.ssh"

        printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/deploy_key"
        chmod 600 "$HOME/.ssh/deploy_key"

        # StrictHostKeyChecking=no はMITM対策として不十分なため使用しない。
        # AWS Session Managerで独立確認済みのproduction ED25519 host keyのみを
        # secrets.PRODUCTION_SSH_HOST_KEY からpinし、既知のホストキーのみ許可する。
        printf '%s %s\n' "$EC2_HOST" "$EC2_SSH_HOST_KEY" > "$HOME/.ssh/known_hosts_production"
        chmod 600 "$HOME/.ssh/known_hosts_production"

        ssh \
          -o StrictHostKeyChecking=yes \
          -o UserKnownHostsFile="$HOME/.ssh/known_hosts_production" \
          -o GlobalKnownHostsFile=/dev/null \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=20 \
          -i "$HOME/.ssh/deploy_key" \
          "${EC2_USER}@${EC2_HOST}" "DEPLOY_PATH='${DEPLOY_PATH}' FORCE_ASSETS_CLOBBER='${FORCE_ASSETS_CLOBBER}' FORCE_FULL_DEPLOY='${FORCE_FULL_DEPLOY}' TRIGGER_COMMIT='${TRIGGER_COMMIT}' bash -s" << 'EOF'
          set -euo pipefail

          echo "Host: $(hostname)"
          echo "Deploy path: ${DEPLOY_PATH}"
          echo "[deploy] FORCE_ASSETS_CLOBBER: ${FORCE_ASSETS_CLOBBER:-false} / FORCE_FULL_DEPLOY: ${FORCE_FULL_DEPLOY:-false}"

          cd "${DEPLOY_PATH}"

          # 最後に成功したデプロイの記録。git reset で消えないようリポジトリの外に置く。
          DEPLOY_STATE_DIR="${HOME}/.be-my-style-deploy"
          mkdir -p "$DEPLOY_STATE_DIR"

          # サーバー上で手動実行したデプロイとも重ならないようにする。
          if command -v flock > /dev/null; then
            exec 9>"${DEPLOY_STATE_DIR}/deploy.lock"
            if ! flock -w 900 9; then
              echo "::error::another deploy is still running on the server (lock: ${DEPLOY_STATE_DIR}/deploy.lock)"
              exit 1
            fi
          else
            echo "::warning::flock is not installed on the server; relying on the Actions concurrency group only"
          fi

          PREV_COMMIT=$(git rev-parse HEAD)
          echo "[deploy] Before: ${PREV_COMMIT}"
          git fetch origin main
          git reset --hard origin/main
          echo "[deploy] After: $(git rev-parse HEAD)"
          # 古い実行を Re-run しても、デプロイするのは常にその時点の origin/main(起動元のコミットではない)。
          if [ -n "${TRIGGER_COMMIT:-}" ] && [ "$TRIGGER_COMMIT" != "$(git rev-parse HEAD)" ]; then
            echo "::notice::this run was triggered by ${TRIGGER_COMMIT} but deploys the current origin/main $(git rev-parse HEAD)"
          fi

          # 以降は更新後のコードにあるスクリプトで行う(実行中のファイルを git reset で書き換えないよう分けている)。
          # 差分判定は「最後に成功したデプロイ」を基準にするため、git reset 後に失敗しても再実行で復旧できる。
          PREV_COMMIT="$PREV_COMMIT" \
          DEPLOY_PATH="$DEPLOY_PATH" \
          DEPLOY_STATE_DIR="$DEPLOY_STATE_DIR" \
          FORCE_ASSETS_CLOBBER="${FORCE_ASSETS_CLOBBER:-false}" \
          FORCE_FULL_DEPLOY="${FORCE_FULL_DEPLOY:-false}" \
            bash script/deploy/production_deploy.sh < /dev/null
        EOF

        rm -f "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts_production"
