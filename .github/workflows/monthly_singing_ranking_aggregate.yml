name: Monthly Singing Ranking Aggregate

on:
  schedule:
    # 毎月28〜31日、06:17 UTC = 15:17 JST に実行し、Job内で月末か判定する。
    # EC2 は毎日 17:00–21:00 UTC (02:00–06:00 JST) に自動停止するため、
    # GitHub Actions のスケジュールが数時間遅延しても停止枠に入らない時刻にしている。
    # 毎時0分付近の混雑を避けるため分は 17。理由を知らずに 14〜17時台 UTC へ戻さないこと。
    - cron: '17 6 28-31 * *'
  workflow_dispatch:

jobs:
  aggregate-season:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for EC2 SSH port
        env:
          EC2_HOST: ${{ secrets.HOST_NAME }}
        run: |
          set -euo pipefail

          test -n "$EC2_HOST"

          for attempt in $(seq 1 10); do
            if nc -z -w 5 "$EC2_HOST" 22; then
              echo "EC2 SSH port is reachable."
              exit 0
            fi

            if [ "$attempt" -lt 10 ]; then
              echo "EC2 SSH port is not reachable. Retry ${attempt}/10 after 30s."
              sleep 30
            fi
          done

          echo "::error::EC2 SSH port did not become reachable within the retry period."
          exit 1

      - name: SSH into EC2 and run AggregateSeasonRankingJob on month-end
        env:
          EC2_SSH_KEY: ${{ secrets.PRIVATE_KEY }}
          EC2_USER: ${{ secrets.USER_NAME }}
          EC2_HOST: ${{ secrets.HOST_NAME }}
          DEPLOY_PATH: '/home/ec2-user/be-my-style'
        run: |
          set -euo pipefail

          test -n "$EC2_SSH_KEY"
          test -n "$EC2_USER"
          test -n "$EC2_HOST"
          test -n "$DEPLOY_PATH"

          echo "$EC2_SSH_KEY" > private_key
          chmod 600 private_key

          ssh \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -i private_key \
            "${EC2_USER}@${EC2_HOST}" "DEPLOY_PATH='${DEPLOY_PATH}' bash -s" << 'EOF'
            set -euo pipefail

            echo "Host: $(hostname)"
            echo "Deploy path: ${DEPLOY_PATH}"
            echo "Running monthly aggregate check at $(date '+%Y-%m-%d %H:%M:%S %Z')"

            cd "${DEPLOY_PATH}"
            RAILS_ENV=production ~/.rbenv/shims/bundle exec rails runner \
              'if Date.current.end_of_month == Date.current
                 season = SingingRankingSeason.current.first
                 if season
                   Singing::AggregateSeasonRankingJob.perform_now(season.id)
                   puts "AggregateSeasonRankingJob completed."
                   Singing::AwardSeasonBadgesJob.perform_now(season.id)
                   puts "AwardSeasonBadgesJob completed."
                 else
                   puts "No current season found for #{Date.current}, skipping."
                 end
               else
                 puts "Not month-end (#{Date.current}), skipping."
               end'

            echo "Monthly aggregate check finished."
          EOF

          rm -f private_key
